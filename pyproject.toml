[project]
name = "kubedian"
version = "1.0.3"
description = "A Kubernetes-native tool that reconstructs the service dependency graph from your Kubernetes/Kustomize manifests — who calls whom, datastores, queues and external APIs. Exposes it as a SQLite graph, a CLI, an MCP server for AI agents, Mermaid diagrams and Markdown docs, without decrypting secrets."
# readme is dynamic: built from README.md with Mermaid blocks replaced for PyPI
# (PyPI does not render Mermaid). See [tool.hatch.metadata.hooks.fancy-pypi-readme].
dynamic = ["readme"]
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Yancel Salinas", email = "yancel.salinas@gmail.com" }]
keywords = ["kubernetes", "kustomize", "service-graph", "mcp", "sre", "mermaid", "dependency-graph", "service-topology"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Documentation",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "PyYAML>=6.0",
    "pydantic>=2.6",
    "typer>=0.12",
]

[project.optional-dependencies]
mcp = ["fastmcp>=2.0"]

[project.scripts]
kubedian = "kubedian.cli:app"
kubedian-mcp = "kubedian.main:main"

[project.urls]
Homepage = "https://github.com/sagoyanfisic/kubedian"
Repository = "https://github.com/sagoyanfisic/kubedian"
Issues = "https://github.com/sagoyanfisic/kubedian/issues"

[build-system]
requires = ["hatchling", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kubedian"]

# Build the PyPI long-description from README.md, but replace ```mermaid blocks
# (which PyPI cannot render) with a link to the rendered diagram on GitHub.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(?s)```mermaid.*?```'
replacement = '> 📊 _Diagram omitted here — [view it rendered on GitHub](https://github.com/sagoyanfisic/kubedian#how-it-works)._'

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
# Defaults (E4/E7/E9 + F) plus import sorting.
extend-select = ["I"]
